<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>地図データの出典</title><style>body{background:#080309;color:#f6e5f0;font:16px/1.8 -apple-system,BlinkMacSystemFont,sans-serif;margin:0}main{max-width:680px;margin:8vh auto;padding:0 24px 60px}a{color:#ff83d9}h1{font-size:26px;font-weight:400}li{margin-bottom:12px}small{color:#c6a6bd}</style></head><body><main><h1>地図データの出典</h1><p>作品の地図は、以下のデータを抽出・簡略化して作成しています。</p><ul><li>道路・河川・大学敷地・相原周辺の線路：© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>（ODbL）</li><li>鉄道：<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N02-2024.html">国土交通省 国土数値情報「鉄道データ」（2024年）</a>、<a href="https://github.com/antfu/mlit-json">antfu/mlit-json</a></li><li>行政区域：<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N03-2026.html">国土交通省 国土数値情報「行政区域データ」</a>、<a href="https://geoshape.ex.nii.ac.jp/city/">国立情報学研究所 Geoshapeリポジトリ</a>（CC BY-SA 4.0）、<a href="https://geo.maderaojen.me/en/">都道府県GeoJSON</a></li><li>海岸線：<a href="https://www.naturalearthdata.com/downloads/10m-physical-vectors/10m-coastline/">Natural Earth</a></li></ul><p>線や経路は映像表現のために簡略化しています。</p><p><a href="./">作品へ戻る</a></p></main></body></html>
